name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  GITHUB_REPO: ${{ github.event.repository.name }}
  GITHUB_PUSHER_NAME: ${{ github.event.pusher.name }}
  GITHUB_PUSHER_EMAIL: ${{ github.event.pusher.email }}
  GITHUB_HEAD_COMMIT: ${{ github.event.head_commit.url }}
  GITHUB_MESG: ${{ github.event.head_commit.message }}
  GITHUB_COMPARE: ${{ github.event.compare }}
  GITHUB_VERSION: ${{ github.event.compare }}
  GITHUB_BRANCH: ${{ github.ref_name }}
  DEPLOYMENT_FILE: "api.yaml"
  DEPLOYMENT_ENV: sit

jobs:
  # Stage 1: Build Docker Image (Common for all branches)
  build-docker-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          repository: CO-OPBANK/${{ github.event.repository.name }}
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.COOPBANK_DEVELOPER_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.COOPBANK_DEVELOPER_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v3
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/co-opbank/${{ github.event.repository.name }}:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/co-opbank/${{ github.event.repository.name }}:buildcache
          cache-to: type=registry,ref=ghcr.io/co-opbank/${{ github.event.repository.name }}:buildcache,mode=max

  # Stage 2: Deploy to SIT
  deploy-sit:
    name: Deploy-SIT
    runs-on: ubuntu-latest
    environment: 'sit'
    needs: build-docker-image
    steps:
      - name: Check out CO-OPBANK/deployments repository
        uses: actions/checkout@v3
        with:
          repository: CO-OPBANK/deployments
          ref: master
          fetch-depth: 0
          token: ${{ secrets.COOPBANK_DEVELOPER_TOKEN }}

      - name: Update Deployment File
        run: |-
          pwd && ls -lrt
          cd sit/${{ github.event.repository.name }}
          currentimage=$(cat ${{ env.DEPLOYMENT_FILE }} | grep image: | awk -F ' ' '{print $NF}' | tr -d '[:blank:]')
          newimage=ghcr.io/co-opbank/${{ github.event.repository.name }}:${{ github.sha }}
          sed -i 's#'"$currentimage"'#'"$newimage"'#g' ${{ env.DEPLOYMENT_FILE }}
          cat ${{ env.DEPLOYMENT_FILE }} | grep image:

      - name: Commit Changes
        run: |
          git config --local user.email ${{ github.event.pusher.email || github.event.pull_request.user.email }}
          git config --local user.name ${{ github.event.pusher.name || github.event.pull_request.user.login }}
          git add .
          git commit -a -m "Updated image version to :${{ github.sha }}::Repo:${{ github.event.head_commit.url}}"

      - name: Push Changes
        uses: ad-m/github-push-action@master
        with:
          repository: CO-OPBANK/deployments
          branch: master
          github_token: ${{ secrets.COOPBANK_DEVELOPER_TOKEN }}

  # Stage 3: Merge Develop to UAT
  merge-develop-to-uat:
    name: Merge Develop to UAT
    runs-on: ubuntu-latest
    needs: deploy-sit
    environment: 'uat'
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          repository: CO-OPBANK/${{ github.event.repository.name }}
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.COOPBANK_DEVELOPER_TOKEN }}

      - name: Merge into UAT Branch
        run: |
          git config --local user.email ${{ github.event.pusher.email || github.event.pull_request.user.email }}
          git config --local user.name ${{ github.event.pusher.name || github.event.pull_request.user.login }}
          git fetch origin uat
          git checkout uat
          git pull origin uat
          git merge develop --no-ff -m "Merge develop into uat"
          git push origin uat

  # Stage 3: Build on UAT
  build-uat:
    name: Build on UAT
    runs-on: ubuntu-latest
    needs: merge-develop-to-uat
    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          repository: CO-OPBANK/${{ github.event.repository.name }}
          ref: uat
          fetch-depth: 0
          token: ${{ secrets.COOPBANK_DEVELOPER_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.COOPBANK_DEVELOPER_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v3
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/co-opbank/${{ github.event.repository.name }}:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/co-opbank/${{ github.event.repository.name }}:buildcache
          cache-to: type=registry,ref=ghcr.io/co-opbank/${{ github.event.repository.name }}:buildcache,mode=max

  # Stage 4: Deploy to UAT
  deploy-uat:
    name: Deploy-UAT
    runs-on: ubuntu-latest
    needs: build-uat
    steps:
      - name: Check out CO-OPBANK/deployments repository
        uses: actions/checkout@v3
        with:
          repository: CO-OPBANK/deployments
          ref: master
          fetch-depth: 0
          token: ${{ secrets.COOPBANK_DEVELOPER_TOKEN }}

      - name: Update Deployment File
        run: |
          pwd && ls -lrt
          cd uat/${{ github.event.repository.name }}
          currentimage=$(cat ${{ env.DEPLOYMENT_FILE }} | grep image: | awk -F ' ' '{print $NF}' | tr -d '[:blank:]')
          newimage=ghcr.io/co-opbank/${{ github.event.repository.name }}:${{ github.sha }}
          sed -i 's#'"$currentimage"'#'"$newimage"'#g' ${{ env.DEPLOYMENT_FILE }}
          cat ${{ env.DEPLOYMENT_FILE }} | grep image:

      - name: Commit Changes
        run: |
          git config --local user.email ${{ github.event.pusher.email || github.event.pull_request.user.email }}
          git config --local user.name ${{ github.event.pusher.name || github.event.pull_request.user.login }}
          git add .
          git commit -a -m "Updated image version to :${{ github.sha }}::Repo:${{ github.event.head_commit.url}}"

      - name: Push Changes
        uses: ad-m/github-push-action@master
        with:
          repository: CO-OPBANK/deployments
          branch: master
          github_token: ${{ secrets.COOPBANK_DEVELOPER_TOKEN }}

  # Stage 5: Merge UAT to PREPROD
  merge-uat-to-preprod:
    name: Merge UAT to PREPROD
    runs-on: ubuntu-latest
    needs: merge-develop-to-uat
    environment: 'preprod'
    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          repository: CO-OPBANK/${{ github.event.repository.name }}
          ref: uat
          fetch-depth: 0
          token: ${{ secrets.COOPBANK_DEVELOPER_TOKEN }}

      - name: Merge into PREPROD Branch
        run: |
          git config --local user.email ${{ github.event.pusher.email || github.event.pull_request.user.email }}
          git config --local user.name ${{ github.event.pusher.name || github.event.pull_request.user.login }}
          git fetch origin preprod
          git checkout preprod
          git pull origin preprod
          git merge uat --no-ff -m "Merge uat into preprod"
          git push origin preprod

  # Stage 5: Build and Deploy to PREPROD
  build-preprod:
    name: Build and Deploy to PREPROD
    runs-on: ubuntu-latest
    needs: merge-uat-to-preprod
    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          repository: CO-OPBANK/${{ github.event.repository.name }}
          ref: preprod
          fetch-depth: 0
          token: ${{ secrets.COOPBANK_DEVELOPER_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.COOPBANK_DEVELOPER_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v3
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/co-opbank/${{ github.event.repository.name }}:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/co-opbank/${{ github.event.repository.name }}:buildcache
          cache-to: type=registry,ref=ghcr.io/co-opbank/${{ github.event.repository.name }}:buildcache,mode=max

  # Stage 6: Deploy to PREPROD
  deploy-preprod:
    name: Deploy-PREPROD
    runs-on: ubuntu-latest
    needs: build-preprod
    steps:
      - name: Check out CO-OPBANK/deployments repository
        uses: actions/checkout@v3
        with:
          repository: CO-OPBANK/deployments
          ref: master
          fetch-depth: 0
          token: ${{ secrets.COOPBANK_DEVELOPER_TOKEN }}

      - name: Update Deployment File
        run: |
          pwd && ls -lrt
          cd preprod/${{ github.event.repository.name }}
          currentimage=$(cat ${{ env.DEPLOYMENT_FILE }} | grep image: | awk -F ' ' '{print $NF}' | tr -d '[:blank:]')
          newimage=ghcr.io/co-opbank/${{ github.event.repository.name }}:${{ github.sha }}
          sed -i 's#'"$currentimage"'#'"$newimage"'#g' ${{ env.DEPLOYMENT_FILE }}
          cat ${{ env.DEPLOYMENT_FILE }} | grep image:

      - name: Commit Changes
        run: |
          git config --local user.email ${{ github.event.pusher.email || github.event.pull_request.user.email }}
          git config --local user.name ${{ github.event.pusher.name || github.event.pull_request.user.login }}
          git add .
          git commit -a -m "Updated image version to :${{ github.sha }}::Repo:${{ github.event.head_commit.url}}"

      - name: Push Changes
        uses: ad-m/github-push-action@master
        with:
          repository: CO-OPBANK/deployments
          branch: master
          github_token: ${{ secrets.COOPBANK_DEVELOPER_TOKEN }}

  # Stage 7: Merge PREPROD to PROD
  merge-preprod-to-prod:
    name: Merge PREPROD to PROD
    runs-on: ubuntu-latest
    environment: 'prod'
    needs: merge-uat-to-preprod
    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          repository: CO-OPBANK/${{ github.event.repository.name }}
          ref: preprod
          fetch-depth: 0
          token: ${{ secrets.COOPBANK_DEVELOPER_TOKEN }}

      - name: Merge into Prod Branch
        run: |
          git config --local user.email ${{ github.event.pusher.email || github.event.pull_request.user.email }}
          git config --local user.name ${{ github.event.pusher.name || github.event.pull_request.user.login }}
          git fetch origin prod
          git checkout prod
          git pull origin prod
          git merge preprod --no-ff -m "Merge preprod into prod"
          git push origin prod
  

  # Stage 8: Build PROD image
  build-prod:
    name: Build to PROD
    runs-on: ubuntu-latest
    needs: merge-preprod-to-prod
    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          repository: CO-OPBANK/${{ github.event.repository.name }}
          ref: prod
          fetch-depth: 0
          token: ${{ secrets.COOPBANK_DEVELOPER_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.COOPBANK_DEVELOPER_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v3
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/co-opbank/${{ github.event.repository.name }}:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/co-opbank/${{ github.event.repository.name }}:buildcache
          cache-to: type=registry,ref=ghcr.io/co-opbank/${{ github.event.repository.name }}:buildcache,mode=max

  # Stage 9: Deploy to PROD
  deploy-prod:
    name: Deploy-PROD
    runs-on: ubuntu-latest
    needs: build-prod
    steps:
      - name: Check out CO-OPBANK/prod_deployment repository
        uses: actions/checkout@v3
        with:
          repository: CO-OPBANK/prod_deployment
          ref: master
          fetch-depth: 0
          token: ${{ secrets.COOPBANK_DEVELOPER_TOKEN }}

      - name: Update Deployment File
        run: |-
          pwd && ls -lrt
          cd ${{ github.event.repository.name }}
          currentimage=$(cat ${{ env.DEPLOYMENT_FILE }} | grep image: | awk -F ' ' '{print $NF}' | tr -d '[:blank:]')
          newimage=ghcr.io/co-opbank/${{ github.event.repository.name }}:${{ github.sha }}
          sed -i 's#'"$currentimage"'#'"$newimage"'#g' ${{ env.DEPLOYMENT_FILE }}
          cat ${{ env.DEPLOYMENT_FILE }} | grep image:

      - name: Commit Changes
        run: |
          git config --local user.email ${{ github.event.pusher.email || github.event.pull_request.user.email }}
          git config --local user.name ${{ github.event.pusher.name || github.event.pull_request.user.login }}
          git add .
          git commit -a -m "Updated image version to :${{ github.sha }}::Repo:${{ github.event.head_commit.url}}"

      - name: Push Changes
        uses: ad-m/github-push-action@master
        with:
          repository: CO-OPBANK/prod_deployment
          branch: master
          github_token: ${{ secrets.COOPBANK_DEVELOPER_TOKEN }}
