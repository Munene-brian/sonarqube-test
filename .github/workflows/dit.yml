name: DIT

on:
  push:
    branches:
      ["feature/**","hotfix/**","release/**","bugfix/**"]
  pull_request:
    branches:
      ["feature/**","hotfix/**","release/**","bugfix/**"]

  workflow_dispatch:

env:
  GITHUB_REPO: ${{ github.event.repository.name }}
  GITHUB_PUSHER_NAME: ${{ github.event.pusher.name }}
  GITHUB_PUSHER_EMAIL: ${{ github.event.pusher.email }}
  GITHUB_HEAD_COMMIT: ${{ github.event.head_commit.url}}
  GITHUB_MESG: ${{ github.event.head_commit.message }}
  GITHUB_COMPARE: ${{ github.event.compare }}
  GITHUB_VERSION: ${{ github.event.compare }}
  GITHUB_BRANCH: ${{ github.ref_name }}
  DEPLOYMENT_FILE: "api.yaml"
  DEPLOYMENT_ENV: dev

jobs:
  # Stage 1: Build Docker Image (Common for all branches)
  build-docker-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          repository: CO-OPBANK/${{ github.event.repository.name }}
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.COOPBANK_DEVELOPER_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.COOPBANK_DEVELOPER_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v3
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/co-opbank/${{ github.event.repository.name }}:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/co-opbank/${{ github.event.repository.name }}:buildcache
          cache-to: type=registry,ref=ghcr.io/co-opbank/${{ github.event.repository.name }}:buildcache,mode=max

  ###########################################################
  #DEPLOY TO DEV ENVIRONMENT
  deploy-dit:
    name: Deploy-DIT
    runs-on: ubuntu-latest
    environment: 'dit'
    needs: build-docker-image
    steps:
      - name: Check out CO-OPBANK/deployments repository
        uses: actions/checkout@v3
        with:
          repository: CO-OPBANK/deployments
          ref: master
          fetch-depth: 0
          token: ${{ secrets.COOPBANK_DEVELOPER_TOKEN }}

      - name: Update Deployment File
        run: |-
          pwd && ls -lrt
          cd dev/${{ github.event.repository.name }}
          currentimage=$(cat ${{ env.DEPLOYMENT_FILE }} | grep image: | awk -F ' ' '{print $NF}' | tr -d '[:blank:]')
          newimage=ghcr.io/co-opbank/${{ github.event.repository.name }}:${{ github.sha }}
          sed -i 's#'"$currentimage"'#'"$newimage"'#g' ${{ env.DEPLOYMENT_FILE }}
          cat ${{ env.DEPLOYMENT_FILE }} | grep image:

      - name: Commit Changes
        run: |
          git config --local user.email ${{ github.event.pusher.email || github.event.pull_request.user.email }}
          git config --local user.name ${{ github.event.pusher.name || github.event.pull_request.user.login }}
          git add .
          git commit -a -m "Updated image version to :${{ github.sha }}::Repo:${{ github.event.head_commit.url}}"

      - name: Push Changes
        uses: ad-m/github-push-action@master
        with:
          repository: CO-OPBANK/deployments
          branch: master
          github_token: ${{ secrets.COOPBANK_DEVELOPER_TOKEN }}
  ###########################################################